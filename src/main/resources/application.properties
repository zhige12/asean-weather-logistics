spring.application.name=asean-weather-logistics
# 确保外网可访问（手机连同一 WiFi 时能连上）
server.address=0.0.0.0
spring.config.import=optional:file:./.env.local[.properties]
# 前端 SPA 构建产物（npm run build 在 frontend/dist/），配合默认 classpath static 目录
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:frontend/dist/
osm.loader.enabled=false
osm.pbf.path=D:/idea/vietnam-260811.osm.pbf
osm.graph.cache.path=D:/idea/graph-cache

# ============ AI Agent（OpenAI 兼容格式）============
# 调用链：本地 Ollama（优先，数据不出境）→ 在线 DeepSeek → 规则模板兜底
# ---- 在线通道：DeepSeek 官方 API（公网直连）----
deepseek.fallback.url=https://api.deepseek.com/chat/completions
# key 未填（或仍是占位符）时视为"未启用在线通道"，直接降级到规则模板
deepseek.fallback.key=${DEEPSEEK_FALLBACK_KEY:}
deepseek.fallback.model=deepseek-chat

# ---- 本地通道：Ollama（优先级最高；拔网线离线演示时全部 AI 功能走本地推理，数据不出境）----
# 本机已安装 qwen2.5:14b（多智能体推理主力）；未启动 Ollama 时短超时快速失败并自动降级，不阻塞演示
ollama.enabled=${OLLAMA_ENABLED:true}
ollama.url=${OLLAMA_URL:http://localhost:11434/v1/chat/completions}
ollama.model=${OLLAMA_MODEL:qwen2.5:14b}

# ---- 多智能体预生成缓存（演示前用 tools/pregen_agent_cache.ps1 跑好三组场景；演示时 2 秒出结果）----
decision.cache.dir=${DECISION_CACHE_DIR:decision-cache}

# 实时气象（比赛 CRA40 实况接口；Token 仅允许在后端环境变量中配置）
weather.real.base-url=${WEATHER_REAL_BASE_URL:http://180.149.156.4:8001}
weather.real.token=${WEATHER_REAL_TOKEN:}
weather.real.observation-time=${WEATHER_REAL_OBSERVATION_TIME:202412312000}
weather.real.bbox-padding-deg=${WEATHER_REAL_BBOX_PADDING_DEG:0.0}
weather.real.request-timeout-seconds=${WEATHER_REAL_TIMEOUT_SECONDS:20}
weather.real.ttl-minutes=10
weather.real.refresh-min-interval-seconds=${WEATHER_REAL_REFRESH_MIN_INTERVAL_SECONDS:15}
# 合规保护：禁止暴力访问上游气象接口
# 最小请求间隔（秒）：每个数据源两次真实请求之间至少间隔这么久，未到期直接用缓存
# （按源各自计算：切到另一个上游不该被上一个源的窗口挡住，见 RealWeatherService）
weather.real.min-request-interval-seconds=${WEATHER_REAL_MIN_REQUEST_INTERVAL_SECONDS:60}
# 跨数据源最小回源间隔（秒）：防止“来回切源”把每个源的窗口变成摆设
weather.real.min-source-switch-gap-seconds=${WEATHER_REAL_MIN_SOURCE_SWITCH_GAP_SECONDS:5}
# 连续失败达阈值后打开熔断窗口，静默期内该源不发起任何请求（401 Token 无效时不重试轰炸）
# 熔断状态同样按源各自计算：官方接口 Token 失效不该把公网 Open-Meteo 一起封掉
weather.real.circuit-failure-threshold=${WEATHER_REAL_CIRCUIT_FAILURE_THRESHOLD:3}
weather.real.circuit-open-seconds=${WEATHER_REAL_CIRCUIT_OPEN_SECONDS:300}

# ============ GOWFS 三小时预报（/api/v1/forecasts/3h，决策沙盘真实降雨源）============
# 与实况共用 base-url/token，但独立节流：预报 3 小时才更新一次，窗口设太长不会更准，
# 设太短会白白多打上游并与实况抢回源额度（实况 60s 窗口、预报默认 30min，互不干扰）。
weather.forecast.enabled=${WEATHER_FORECAST_ENABLED:true}
weather.forecast.min-request-interval-seconds=${WEATHER_FORECAST_MIN_INTERVAL_SECONDS:1800}
# 起报时次：仅允许 08:00 / 20:00（YYYYMMDDHHMM）。默认与实况时次对齐，便于演示对照。
# 实测参考（bbox 覆盖友谊关—芒街，variables=PRE，时效 3,6）：
#   202412312000 → 该区域无降水，6h 累计 0mm（旱季，沙盘显示"通行正常"）
#   202407152000 → 有真实降水，单格点 6h 累计约 10–15mm（雨季，演示真实取数建议用这个）
#   202406150800 → 有降水，量级同上
weather.forecast.run-time=${WEATHER_FORECAST_RUN_TIME:202412312000}
# 参与"累计降雨"的预报时效：3,6 即未来 6h（3 的倍数，最多 5 个）
# 注意量级：CRA40/GOWFS 真实 6h 累计降水通常为个位数至十余 mm，
# 远低于沙盘 80mm 熔断阈值——所以"第二幕熔断"仍需剧本值驱动，真实预报用于证明数据来源。
weather.forecast.hours=${WEATHER_FORECAST_HOURS:3,6}
weather.forecast.timeout-seconds=${WEATHER_FORECAST_TIMEOUT_SECONDS:20}
weather.forecast.circuit-failure-threshold=${WEATHER_FORECAST_CIRCUIT_FAILURE_THRESHOLD:3}
weather.forecast.circuit-open-seconds=${WEATHER_FORECAST_CIRCUIT_OPEN_SECONDS:600}

# 气象数据源（运行时可切换，默认比赛官方接口）
# 可选：contest-observation 比赛官方CRA40 / open-meteo 公网真实气象 / simulated 离线模拟
weather.source=${WEATHER_SOURCE:contest-observation}
# 公网真实气象接口（Open-Meteo，免费免 Token）
weather.openmeteo.base-url=${WEATHER_OPENMETEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
weather.openmeteo.timeout-seconds=${WEATHER_OPENMETEO_TIMEOUT_SECONDS:20}
weather.openmeteo.batch-size=${WEATHER_OPENMETEO_BATCH_SIZE:20}

# ============ 后台气象守护（不依赖客户端的真实气象检测触发源）============
# 关闭后系统退回「只有前端轮询时才检测气象」的老行为；演示需临时静音守护时置 false
weather.watchdog.enabled=${WEATHER_WATCHDOG_ENABLED:true}
# 巡检周期：默认 60s 贴 RealWeatherService.min-request-interval-seconds 下限，
# 调更短也不会多打请求（真正发不发仍由上游节流与熔断决定）；支持 60s / PT1M 这类时长写法
weather.watchdog.interval=${WEATHER_WATCHDOG_INTERVAL:60s}
# 启动延迟：等路网与数据源就绪后再开始第一轮
weather.watchdog.initial-delay=${WEATHER_WATCHDOG_INITIAL_DELAY:20s}

# ============ 天地图瓦片同源代理（前端唯一取瓦入口）============
# 密钥只存后端且**不入库**：前端一律请求同源 /api/tianditu/{layer}/{z}/{x}/{y}.png，
# 代理按 tianditu.keys 密钥池轮转回源（per-key 熔断，某 key 限流只冷却它自己），
# 并两级缓存（内存 LRU + 磁盘 data/tile-cache），热门瓦片全生命周期只回源一次。
# 真实密钥写在本地 .env.local（已 gitignore）的 TIANDITU_KEYS 中；此处默认值置空，
# 未配置时天地图层自动不可用，前端降级到其余底图源。
tianditu.tk=${TIANDITU_TK:}
tianditu.keys=${TIANDITU_KEYS:}
# 磁盘瓦片缓存根目录（相对进程工作目录）：瓦片内容不可变，落盘后重启不丢、配额只花一次
tianditu.cache-dir=${TIANDITU_CACHE_DIR:data/tile-cache}
# 兜底 Referer：前端同源请求的 Referer 会优先透传；缺失时用这个，须是天地图密钥已授权的域名，否则上游 403/418
tianditu.referer=${TIANDITU_REFERER:}
# 单张瓦片上游请求超时（秒）：超时即冷却该 key 并换 key 重试，全池失败才 503 让前端降级
tianditu.timeout-seconds=${TIANDITU_TIMEOUT_SECONDS:6}

# ============ 公网演示护栏（初赛：本机 + Tailscale Funnel 暴露给评委）============
# 详见 PublicDemoGuardFilter。只作用于 /api/ 下的非 GET 请求，GET 与 SSE 长连接一律放行。
demo.guard.enabled=${DEMO_GUARD_ENABLED:true}
# 一键打挂整机的接口：会加载 311MB OSM PBF 且路径是 Windows 绝对路径，公网必须封死
demo.guard.deny-osm-loader=${DEMO_GUARD_DENY_OSM:true}
# 改全局状态的写接口（复位/熔断/场景注入/切换气象源/AI 扫描）每 IP 每分钟上限：
# 防两位评委同时操作把演示状态互相打回，后打开的看到一个说不通的死局
demo.guard.strict-limit-per-minute=${DEMO_GUARD_STRICT_LIMIT:20}
# 其余写接口上限要给足：/api/agent/register 每次算路都发、大屏 15 秒轮询也在发，
# 按“写操作即可疑”一刀切会让评委莫名卡顿
demo.guard.normal-limit-per-minute=${DEMO_GUARD_NORMAL_LIMIT:180}

# ============ 平陆运河通航观测数据接入（预留「广西水运江河海一体化调度平台」对接）============
# 数据源：mock=比赛/演示阶段（手动推送验证同一接入链路）/ official=调度平台正式接口
# 边界声明：官方平台无自助 API 申请入口，接口地址与凭证经合作协议获取后填入下方配置，
# 切换 official 不需要改动禁航判定与 canal-block 触达链路的核心代码。
waterway.source=${WATERWAY_SOURCE:mock}
waterway.official.api-base=${WATERWAY_OFFICIAL_API_BASE:}
waterway.official.token=${WATERWAY_OFFICIAL_TOKEN:}
waterway.official.timeout-seconds=${WATERWAY_OFFICIAL_TIMEOUT_SECONDS:15}
# 轮询节奏：与水文站 15 分钟上报频率对齐，仅 source=official 时生效
# （mock 模式不轮询，避免定时把演示剧本手动注入的禁航值打回正常）
waterway.poll-interval-ms=${WATERWAY_POLL_INTERVAL_MS:900000}
waterway.poll-initial-delay-ms=${WATERWAY_POLL_INITIAL_DELAY_MS:30000}

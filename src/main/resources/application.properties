spring.application.name=asean-weather-logistics
# 确保外网可访问（手机连同一 WiFi 时能连上）
server.address=0.0.0.0
spring.config.import=optional:file:./.env.local[.properties]
# 前端 SPA 构建产物（npm run build 在 frontend/dist/），配合默认 classpath static 目录
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:frontend/dist/
osm.loader.enabled=false
osm.pbf.path=D:/idea/vietnam-260811.osm.pbf
osm.graph.cache.path=D:/idea/graph-cache

# ============ AI Agent（OpenAI 兼容格式）============
# ---- 主通道：公司内网 new-api 网关（需连公司 VPN，见 tools/start_vpn_verify.ps1）----
# 接不上 / 无令牌 / 超时 8 秒 → 自动切备用通道（在线 DeepSeek）
deepseek.api.url=http://172.20.10.3:3000/v1/chat/completions
# key 未填（或仍是占位符）时视为"未启用主通道"，直接走备用在线通道
deepseek.api.key=<向公司申请 new-api 令牌，形如 sk-xxx>
# 模型名由网关渠道决定；连上 VPN 后用令牌 GET http://172.20.10.3:3000/v1/models 可查可选模型
deepseek.model=deepseek-chat

# ---- 备用通道：在线 DeepSeek 官方 API（公网直连，无需 VPN）----
deepseek.fallback.url=https://api.deepseek.com/chat/completions
deepseek.fallback.key=${DEEPSEEK_FALLBACK_KEY:}
deepseek.fallback.model=deepseek-chat

# ---- 本地通道：Ollama（优先级最高；拔网线离线演示时全部 AI 功能走本地推理，数据不出境）----
# 本机已安装 qwen2.5:14b（多智能体推理主力）；未启动 Ollama 时短超时快速失败并自动降级，不阻塞演示
ollama.enabled=${OLLAMA_ENABLED:true}
ollama.url=${OLLAMA_URL:http://localhost:11434/v1/chat/completions}
ollama.model=${OLLAMA_MODEL:qwen2.5:14b}

# ---- 多智能体预生成缓存（演示前用 tools/pregen_agent_cache.ps1 跑好三组场景；演示时 2 秒出结果）----
decision.cache.dir=${DECISION_CACHE_DIR:decision-cache}

# 实时气象（比赛 CRA40 实况接口；Token 仅允许在后端环境变量中配置）
weather.real.base-url=${WEATHER_REAL_BASE_URL:http://180.149.156.4:8001}
weather.real.token=${WEATHER_REAL_TOKEN:}
weather.real.observation-time=${WEATHER_REAL_OBSERVATION_TIME:202412312000}
weather.real.bbox-padding-deg=${WEATHER_REAL_BBOX_PADDING_DEG:0.0}
weather.real.request-timeout-seconds=${WEATHER_REAL_TIMEOUT_SECONDS:20}
weather.real.ttl-minutes=10
weather.real.refresh-min-interval-seconds=${WEATHER_REAL_REFRESH_MIN_INTERVAL_SECONDS:15}
# 合规保护：禁止暴力访问上游气象接口
# 最小请求间隔（秒）：任意数据源两次真实请求之间至少间隔这么久，未到期直接用缓存
weather.real.min-request-interval-seconds=${WEATHER_REAL_MIN_REQUEST_INTERVAL_SECONDS:60}
# 连续失败达阈值后打开熔断窗口，静默期内不发起任何请求（401 Token 无效时不重试轰炸）
weather.real.circuit-failure-threshold=${WEATHER_REAL_CIRCUIT_FAILURE_THRESHOLD:3}
weather.real.circuit-open-seconds=${WEATHER_REAL_CIRCUIT_OPEN_SECONDS:300}

# 气象数据源（运行时可切换，默认比赛官方接口）
# 可选：contest-observation 比赛官方CRA40 / open-meteo 公网真实气象 / simulated 离线模拟
weather.source=${WEATHER_SOURCE:contest-observation}
# 公网真实气象接口（Open-Meteo，免费免 Token）
weather.openmeteo.base-url=${WEATHER_OPENMETEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
weather.openmeteo.timeout-seconds=${WEATHER_OPENMETEO_TIMEOUT_SECONDS:20}
weather.openmeteo.batch-size=${WEATHER_OPENMETEO_BATCH_SIZE:20}

# ============ 天地图瓦片同源代理（前端唯一取瓦入口）============
# 密钥只存后端：前端一律请求同源 /api/tianditu/{layer}/{z}/{x}/{y}.png，
# 代理按 tianditu.keys 密钥池轮转回源（per-key 熔断，某 key 限流只冷却它自己），
# 并两级缓存（内存 LRU + 磁盘 data/tile-cache），热门瓦片全生命周期只回源一次。
# 旧 tianditu.tk 保留为池首兼容项；TIANDITU_KEYS 环境变量可整体覆盖密钥池。
tianditu.tk=${TIANDITU_TK:}
tianditu.keys=${TIANDITU_KEYS:74b48c764cfd71c7a46be5fbf4242ecc,7f8ca63ad8984e9f2d4f0731c1e64fac,05ff73a1e7f6750e0a413e8c4d350869,a94951f2cd0628c79dbbad6fd6429898,5c44f9d96a14869fbc175f4906817b2a}
# 磁盘瓦片缓存根目录（相对进程工作目录）：瓦片内容不可变，落盘后重启不丢、配额只花一次
tianditu.cache-dir=${TIANDITU_CACHE_DIR:data/tile-cache}
# 兜底 Referer：前端同源请求的 Referer 会优先透传；缺失时用这个，须是天地图密钥已授权的域名，否则上游 403/418
tianditu.referer=${TIANDITU_REFERER:}
# 单张瓦片上游请求超时（秒）：超时即冷却该 key 并换 key 重试，全池失败才 503 让前端降级
tianditu.timeout-seconds=${TIANDITU_TIMEOUT_SECONDS:6}

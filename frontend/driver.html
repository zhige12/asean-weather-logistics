<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>志哥-司机助手 · 跨境物流气象预警</title>

  <!-- PWA：支持添加到手机主屏幕、独立窗口运行（无浏览器地址栏） -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f3460" />
  <meta name="description" content="面向中国—东盟跨境货运司机的气象风险预警与智能绕行助手" />

  <!-- iOS 添加到主屏幕 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="司机助手" />
  <link rel="apple-touch-icon" href="/icon-source.png" />

  <style>
    /* 动态加载页：Vue 挂载前可见、挂载后随 #app 内容被整体替换；
       手机经 server.url 远程加载时首屏有网络延迟，这里兜住白屏 */
    body { margin: 0; background: #ffffff; }
    #boot-veil { position: fixed; inset: 0; z-index: 9999; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #ffffff 0%, #f2f8ff 62%, #e7f1ff 100%); font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    /* 背景缓慢漂移的光晕（浅蓝淡晕，白底上有层次不抢字） */
    #boot-veil::before { content: ''; position: absolute; left: -20%; top: -30%; width: 80%; height: 80%; background: radial-gradient(circle, rgba(59,130,246,.16), transparent 62%); animation: boot-float 7s ease-in-out infinite alternate; }
    #boot-veil::after { content: ''; position: absolute; right: -25%; bottom: -35%; width: 85%; height: 85%; background: radial-gradient(circle, rgba(14,165,233,.14), transparent 62%); animation: boot-float 9s ease-in-out infinite alternate-reverse; }
    @keyframes boot-float { from { transform: translate(0,0); } to { transform: translate(60px, 50px); } }
    .boot-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
    /* 致力致宁：阶梯排布（上排致力，致宁从“力”正下方开始往右下错一格，对齐 logo 走位）逐字浮现 + 流光描字 */
    #boot-word { display: grid; grid-template-columns: repeat(4, auto); gap: 14px 12px; align-items: center; }
    .bc { display: inline-block; font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: 2px; opacity: 0; background: linear-gradient(120deg, #ff2d55, #f5a600, #16a34a, #0ea5e9, #7c3aed, #ff2d55); background-size: 280% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; animation: boot-reveal 1.1s cubic-bezier(.2,.7,.3,1) forwards, boot-shine 3.6s linear infinite; }
    .bc.k1 { grid-column: 1; grid-row: 1; animation-delay: .20s, 2.2s; }
    .bc.k2 { grid-column: 2; grid-row: 1; animation-delay: .45s, 2.2s; }
    .bc.k3 { grid-column: 2; grid-row: 2; animation-delay: .95s, 2.2s; }
    .bc.k4 { grid-column: 3; grid-row: 2; animation-delay: 1.20s, 2.2s; }
    .bc.k5 { grid-column: 4; grid-row: 2; align-self: end; font-size: 44px; animation-delay: 1.45s, 2.2s; }
    .bc.k6 { grid-column: 3; grid-row: 1; align-self: end; font-size: 44px; animation-delay: .70s, 2.2s; }
    #boot-mid { display: none; }
    @keyframes boot-reveal { from { opacity: 0; transform: translateY(28px) scale(.82); filter: blur(10px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes boot-shine { 0% { background-position: 220% 0; } 100% { background-position: -220% 0; } }
    @keyframes boot-pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
    #boot-slogan { margin-top: 22px; font-size: 14px; letter-spacing: 6px; color: rgba(30,41,59,.66); opacity: 0; animation: boot-fade 1s ease 1.3s forwards; }
    @keyframes boot-fade { to { opacity: 1; } }
    /* 不确定进度条：循环滑动光带 */
    #boot-bar { position: relative; margin-top: 30px; width: 190px; height: 4px; border-radius: 4px; background: rgba(15,23,42,.10); overflow: hidden; opacity: 0; animation: boot-fade .8s ease 1.5s forwards; }
    #boot-bar i { position: absolute; top: 0; left: -42%; width: 42%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, transparent, #f5a600, #16a34a, #0ea5e9, #7c3aed, transparent); animation: boot-slide 1.35s ease-in-out infinite; }
    @keyframes boot-slide { 0% { left: -42%; } 100% { left: 100%; } }
    #boot-tip { margin-top: 16px; font-size: 12px; letter-spacing: 1px; color: rgba(30,41,59,.55); opacity: 0; animation: boot-fade .8s ease 1.7s forwards; }
    #boot-brand { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 3px; color: rgba(30,41,59,.4); }
    /* 淡出：由 main.js 在至少显示 5s 后（或点跳过）加 .boot-hide 触发，过渡结束后移除节点 */
    #boot-veil { transition: opacity .5s ease; }
    #boot-veil.boot-hide { opacity: 0; pointer-events: none; }
    /* 右上角跳过按钮：带倒计时，点击立即淡出 */
    #boot-skip { position: absolute; top: calc(18px + env(safe-area-inset-top)); right: 18px; z-index: 2; display: inline-flex; align-items: center; gap: 4px; padding: 7px 15px; border-radius: 999px; border: 1px solid rgba(15,23,42,.16); background: rgba(15,23,42,.05); color: rgba(30,41,59,.8); font-size: 13px; letter-spacing: 1px; cursor: pointer; -webkit-tap-highlight-color: transparent; backdrop-filter: blur(6px); opacity: 0; animation: boot-fade .6s ease .6s forwards; }
    #boot-skip:active { background: rgba(15,23,42,.12); }
    #boot-skip b { font-weight: 700; font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: reduce) { .bc, #boot-mid { animation: boot-fade .01s ease forwards; } #boot-bar i { animation: none; left: 29%; } #boot-veil::before, #boot-veil::after { animation: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- 独立加载层：不放进 #app，避免被 Vue 挂载瞬间替换；由 main.js 保证至少显示 5s（或点跳过）再淡出移除 -->
  <div id="boot-veil">
    <div class="boot-inner">
      <div id="boot-word"><span class="bc k1">致</span><span class="bc k2">力</span><span class="bc k6">，</span><span class="bc k3">致</span><span class="bc k4">宁</span><span class="bc k5">。</span></div>
      <div id="boot-slogan">跨境物流气象预警</div>
      <div id="boot-bar"><i></i></div>
      <div id="boot-tip">正在连接导航服务…</div>
    </div>
    <div id="boot-brand">志哥出品</div>
    <button id="boot-skip" type="button">跳过 <b>5</b></button>
  </div>
  <script type="module" src="/src/driver/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
    }
  </script>
</body>
</html>

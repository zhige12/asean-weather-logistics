<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <defs>
    <!-- 图钉：纵向棱镜彩虹 -->
    <linearGradient id="spinGrad" gradientUnits="userSpaceOnUse" x1="360" y1="170" x2="670" y2="620">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.22" stop-color="#ff7a00"/>
      <stop offset="0.42" stop-color="#f5c400"/>
      <stop offset="0.62" stop-color="#16a34a"/>
      <stop offset="0.82" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- 文字：横向棱镜彩虹（跨整个字块流动） -->
    <linearGradient id="stextGrad" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="724" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.25" stop-color="#f5a600"/>
      <stop offset="0.5" stop-color="#16a34a"/>
      <stop offset="0.75" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="sround"><rect x="64" y="64" width="896" height="896" rx="210"/></clipPath>
  </defs>
  <!-- 满幅白底 -->
  <rect width="2732" height="2732" fill="#ffffff"/>
  <!-- 居中 logo（与 appicon 同一套，放大 2 倍居中） -->
  <g transform="translate(342 342) scale(2)">
    <rect x="64" y="64" width="896" height="896" rx="210" fill="#ffffff"/>
    <g clip-path="url(#sround)">
      <g transform="translate(102.4 40) scale(0.8)">
        <path d="M512 168 C 418 168 342 244 342 338 C 342 442 470 556 512 636 C 554 556 682 442 682 338 C 682 244 606 168 512 168 Z" fill="url(#spinGrad)"/>
        <circle cx="512" cy="336" r="66" fill="#ffffff"/>
      </g>
      <g font-family="KaiTi, STKaiti, 'Microsoft YaHei', serif" font-weight="700" font-size="130" text-anchor="middle" fill="url(#stextGrad)">
        <text x="350" y="712">志</text>
        <text x="512" y="712">莉</text>
        <text x="512" y="862">志</text>
        <text x="674" y="862">宁</text>
      </g>
    </g>
  </g>
</svg>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>业务流程示意图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: "Microsoft YaHei", sans-serif; color: #1c2b3a; }
  #fig { width: 1200px; padding: 34px 40px 30px; }
  h1 { font-size: 26px; color: #17457c; text-align: center; }
  .sub { font-size: 14px; color: #6b7a89; text-align: center; margin: 8px 0 28px; }

  .flow { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .step { width: 640px; border: 1.5px solid #bfcfdd; border-radius: 8px; background: #f5f9fc;
          padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .step .ic { flex: 0 0 40px; height: 40px; border-radius: 50%; background: #17457c; color: #fff;
              display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
  .step .tx b { font-size: 16px; color: #17457c; }
  .step .tx span { font-size: 13px; color: #55687a; margin-left: 10px; }
  .step.decide { background: #fdf4ec; border-color: #d9a173; }
  .step.decide .ic { background: #b35215; }
  .step.decide .tx b { color: #b35215; }
  .step.act { background: #f0f9f3; border-color: #86c79f; }
  .step.act .ic { background: #2e8b57; }
  .step.act .tx b { color: #1f6f45; }
  .down { color: #17457c; font-size: 18px; line-height: 1; }
  .branch { width: 640px; display: flex; gap: 14px; }
  .branch .b { flex: 1; border: 1.5px dashed #86c79f; border-radius: 8px; background: #f0f9f3;
               padding: 10px 14px; text-align: center; font-size: 13px; color: #33475b; }
  .branch .b b { color: #1f6f45; display: block; font-size: 14.5px; margin-bottom: 3px; }
</style>
</head>
<body spellcheck="false">
<div id="fig">
  <h1>业务流程示意图</h1>
  <div class="sub">一次「突发气象 → 协同调度」的完整闭环</div>

  <div class="flow">
    <div class="step"><div class="ic">1</div><div class="tx"><b>拉取气象数据</b><span>CRA40 官方实况与预报，逐格点取数</span></div></div>
    <div class="down">▼</div>
    <div class="step"><div class="ic">2</div><div class="tx"><b>逐段风险评估</b><span>公路 / 航段按多要素计算风险分</span></div></div>
    <div class="down">▼</div>
    <div class="step decide"><div class="ic">3</div><div class="tx"><b>阈值熔断判定</b><span>越红线（暴雨禁航、能见度、中断）？</span></div></div>
    <div class="down">▼　命中</div>
    <div class="step"><div class="ic">4</div><div class="tx"><b>受影响运单清单</b><span>锁定在途与待发行程，触发多路线重规划</span></div></div>
    <div class="down">▼</div>
    <div class="step"><div class="ic">5</div><div class="tx"><b>AI 生成替代方案</b><span>公路绕行 / 改走水运 / 等待，附 ETA 与成本</span></div></div>
    <div class="down">▼</div>
    <div class="step act"><div class="ic">6</div><div class="tx"><b>调度员确认派单</b><span>人在回路一键拍板，任务同步司机端</span></div></div>
    <div class="down">▼</div>
    <div class="branch">
      <div class="b"><b>司机执行</b>接单导航 · 途中语音预警 · 一键改道</div>
      <div class="b"><b>回执闭环</b>已改道 / 受阻回传大屏 · 决策日志留痕可回溯</div>
    </div>
  </div>
</div>
</body>
</html>

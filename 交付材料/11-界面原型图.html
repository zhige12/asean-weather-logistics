<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>界面原型图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: "Microsoft YaHei", sans-serif; color: #1c2b3a; }
  #fig { width: 1200px; padding: 34px 40px 30px; }
  h1 { font-size: 26px; color: #17457c; text-align: center; }
  .sub { font-size: 14px; color: #6b7a89; text-align: center; margin: 8px 0 24px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; }
  figure { border: 1px solid #c9d6e2; border-radius: 8px; overflow: hidden; background: #fff; }
  figure img { width: 100%; height: 330px; object-fit: cover; object-position: top left; display: block; }
  figure.phone img { height: 330px; object-fit: cover; object-position: top center;
                     width: auto; margin: 0 auto; display: block; background: #f0f4f8; }
  figcaption { padding: 10px 14px; border-top: 1px solid #e0e8ef; font-size: 13.5px; color: #33475b; }
  figcaption b { color: #17457c; font-size: 15px; margin-right: 8px; }
  .note { margin-top: 18px; font-size: 13px; color: #6b7a89; text-align: center; }
</style>
</head>
<body spellcheck="false">
<div id="fig">
  <h1>界面原型图（真实系统截图）</h1>
  <div class="sub">调度大屏与司机端实时联动 · 以下界面均可在在线 Demo 中实际操作</div>

  <div class="grid">
    <figure>
      <img src="_ui/big-01-总览.jpg" alt="调度大屏总览">
      <figcaption><b>调度大屏 · 总览</b>地图风险着色、沿线气象气泡与航线实况一屏集中呈现</figcaption>
    </figure>
    <figure>
      <img src="_ui/big-07-AI方案对比.jpg" alt="AI 方案对比">
      <figcaption><b>调度大屏 · 方案比选</b>AI 给出多路线的 ETA、风险与成本对比，确认后一键派单</figcaption>
    </figure>
    <figure class="phone">
      <img src="_ui/drv-02-任务.jpg" alt="司机端任务">
      <figcaption><b>司机端 · 接单与导航</b>任务实时送达，接单后进入导航并按在途进度修正到达时间</figcaption>
    </figure>
    <figure class="phone">
      <img src="_ui/drv-03-预警.jpg" alt="司机端预警">
      <figcaption><b>司机端 · 途中预警</b>前方风险升级时语音播报预警条，提供一键换线与停驶待命</figcaption>
    </figure>
  </div>

  <div class="note">大屏 https://zhi-ning.cn/ 　·　司机端 https://zhi-ning.cn/driver.html（手机可安装为应用）　·　备用入口 https://8.138.229.14:8443/</div>
</div>
</body>
</html>

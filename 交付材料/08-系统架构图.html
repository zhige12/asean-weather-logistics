<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>核心逻辑链</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: "Microsoft YaHei", sans-serif; color: #1c2b3a; }
  #fig { width: 1200px; padding: 34px 40px 30px; }
  h1 { font-size: 26px; color: #17457c; text-align: center; }
  .sub { font-size: 14px; color: #6b7a89; text-align: center; margin: 8px 0 30px; }

  .chain { display: flex; align-items: stretch; gap: 0; }
  .node { flex: 1; border: 1.5px solid #bfcfdd; border-radius: 8px; background: #f5f9fc;
          padding: 16px 10px 14px; text-align: center; position: relative; }
  .node .no { position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
              width: 26px; height: 26px; line-height: 26px; border-radius: 50%;
              background: #17457c; color: #fff; font-size: 14px; font-weight: 700; }
  .node b { display: block; font-size: 16px; color: #17457c; margin-top: 6px; }
  .node span { display: block; font-size: 12px; color: #6b7a89; margin-top: 6px; line-height: 1.6; }
  .link { flex: 0 0 34px; display: flex; align-items: center; justify-content: center;
          color: #17457c; font-size: 20px; }
  .node.hot { border-color: #2e8b57; background: #f0f9f3; }
  .node.hot .no { background: #2e8b57; }
  .node.hot b { color: #1f6f45; }

  .back { margin-top: 26px; border: 1.5px dashed #b35215; border-radius: 8px; background: #fdf4ec;
          padding: 12px 18px; font-size: 14px; color: #8a4a17; text-align: center; }
  .back b { color: #b35215; }
  .foot { margin-top: 22px; padding-top: 12px; border-top: 1px solid #d8e2ea;
          font-size: 13px; color: #6b7a89; text-align: center; }
</style>
</head>
<body spellcheck="false">
<div id="fig">
  <h1>气象驱动决策主线</h1>
  <div class="sub">一次突发气象如何走完「感知 → 研判 → 决策 → 执行 → 反馈」闭环</div>

  <div class="chain">
    <div class="node"><span class="no">1</span><b>气象感知</b><span>官方实况 + 预报<br>逐格点取数</span></div>
    <div class="link">→</div>
    <div class="node"><span class="no">2</span><b>风险评估</b><span>逐路段/航段<br>多要素评分</span></div>
    <div class="link">→</div>
    <div class="node"><span class="no">3</span><b>熔断判定</b><span>越红线即中断<br>规则引擎决策</span></div>
    <div class="link">→</div>
    <div class="node hot"><span class="no">4</span><b>多路线重规划</b><span>公路绕行 / 改走水运<br>等待 · 折返备选</span></div>
    <div class="link">→</div>
    <div class="node"><span class="no">5</span><b>调度确认</b><span>AI 解释方案<br>调度员一键拍板</span></div>
    <div class="link">→</div>
    <div class="node"><span class="no">6</span><b>两端执行</b><span>司机端接单导航<br>双语预警叫应</span></div>
  </div>

  <div class="back"><b>反馈闭环</b>：司机途中「已改道 / 受阻」回执与最新位置实时回传大屏，风险变化时全链路自动重算，全程写入决策日志可回溯</div>

  <div class="foot">数值全部由确定性规则引擎产出，大模型只做文字解释 —— 「引擎给边界，模型给文字」</div>
</div>
</body>
</html>

# Gradle build settings.
# NOTE: this file is read as ISO-8859-1 by Gradle, so comments here stay ASCII-only.
#
# ---------------------------------------------------------------------------
# JDK 21 resolution (build.gradle pins the toolchain to Java 21)
# ---------------------------------------------------------------------------
# Gradle auto-detects JDKs in the usual locations (JAVA_HOME, PATH,
# C:\Program Files\Java\*, ~/.jdks/*) and, if nothing matches, can download one.
# Both settings below are MACHINE-SPECIFIC overrides. They are deliberately
# left commented out so that a fresh clone builds on any machine that has a
# JDK 21 installed. If your machine has several JDKs and auto-detection picks
# the wrong one, uncomment the two lines and point them at YOUR OWN JDK 21
# (better still, put them in ~/.gradle/gradle.properties so they never end up
# in the repository).
#
# org.gradle.java.home=C\:\\Program Files\\Java\\jdk-21.0.12+8
# org.gradle.java.installations.paths=C\:\\Program Files\\Java\\jdk-21.0.12+8
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
